title: EvalKit Framework
description: 基于 Java 的自动化 AI 评测框架，以 DAG 工作流为核心，快速完成对大模型或 AI 业务接口的自动化评测。
baseurl: "/evalkit-framework"
url: "https://zendodx.github.io"

# just-the-docs 主题
remote_theme: just-the-docs/just-the-docs@v0.10.0

# 全文搜索
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# 导航辅助链接（右上角）
aux_links:
  "GitHub":
    - "https://github.com/zendodx/evalkit-framework"

aux_links_new_tab: true

# 页脚
footer_content: "Copyright &copy; 2024-2026 EvalKit Framework. Distributed under the Apache 2.0 license."

# 代码复制按钮
enable_copy_code_button: true

# 标注块（Callouts）
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# 返回顶部按钮
back_to_top: true
back_to_top_text: "返回顶部"

# Markdown 扩展
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# 排除不需要渲染的目录
exclude:
  - "*.gemspec"
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules/"
  - "vendor/"
  - "files/"

