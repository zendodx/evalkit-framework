<!-- 侧边栏样式 - GitHub风格过滤器、搜索、用例列表 -->
<style th:fragment="sidebar">
    /* ========================================
       过滤器样式（GitHub风格）
       ======================================== */
    .filter-section {
        padding: var(--spacing-lg) var(--spacing-lg);
        border-bottom: 1px solid var(--color-border);
        display: flex;
        gap: var(--spacing-sm);
        flex-direction: column;
        flex: 0 0 auto;
    }

    .filter-btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-md);
    }

    .filter-btn {
        flex: 1;
        min-width: 60px;
        height: 32px;
        border: 1px solid var(--color-border);
        background: var(--color-bg-primary);
        border-radius: var(--border-radius-base);
        font-size: var(--font-size-sm);
        cursor: pointer;
        transition: all var(--transition-fast);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 500;
        color: var(--color-text-primary);
    }

    .filter-btn:hover {
        border-color: var(--color-primary);
        color: var(--color-primary);
        box-shadow: 0 0 0 1px var(--color-primary);
    }

    .filter-btn.active {
        background: var(--color-primary);
        color: var(--color-bg-primary);
        border-color: var(--color-primary);
    }

    /* ========================================
       搜索框样式（GitHub风格）
       ======================================== */
    .search-section {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        margin-top: var(--spacing-sm);
    }

    .search-box {
        position: relative;
        flex: 1;
        min-width: 0;
    }

    .search-input {
        width: 100%;
        height: 32px;
        font-size: var(--font-size-sm);
        border: 1px solid var(--color-border);
        border-radius: var(--border-radius-base);
        outline: none;
        padding: 0 32px 0 var(--spacing-lg);
        transition: border-color var(--transition-fast);
        background: var(--color-bg-primary);
    }

    .search-input:focus {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
    }

    .search-clear-btn {
        position: absolute;
        top: 50%;
        right: var(--spacing-lg);
        transform: translateY(-50%);
        width: 20px;
        height: 20px;
        line-height: 20px;
        text-align: center;
        border: none;
        background: none;
        color: var(--color-text-placeholder);
        cursor: pointer;
        font-size: 14px;
        transition: color var(--transition-fast);
    }

    .search-clear-btn:hover {
        color: var(--color-error);
    }

    .highlight {
        background: #fff8c5;
        color: #24292f;
        padding: 0 var(--spacing-xs);
        border-radius: var(--border-radius-sm);
    }

    /* 搜索框提示按钮 */
    .search-tip-btn {
        width: 24px;
        height: 24px;
        border: 1px solid var(--color-border);
        background: var(--color-bg-secondary);
        color: var(--color-text-primary);
        border-radius: var(--border-radius-base);
        cursor: pointer;
        font-size: 13px;
        line-height: 0;
        text-align: center;
        transition: all .2s;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .search-tip-btn:hover {
        background: var(--color-primary);
        color: #fff;
        border-color: var(--color-primary);
    }

    /* 搜索提示弹出框 */
    .search-tip-pop {
        position: absolute;
        top: 36px;
        left: 256px;
        width: 310px;
        background: #fff;
        border: 1px solid var(--color-border);
        border-radius: var(--border-radius-base);
        box-shadow: var(--shadow-md);
        font-size: 12px;
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s;
    }

    .search-tip-pop.show {
        opacity: 1;
        pointer-events: auto;
    }

    .tip-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--spacing-lg) var(--spacing-xl);
        border-bottom: 1px solid var(--color-border);
        font-weight: 600;
        color: var(--color-text-primary);
    }

    .tip-close {
        cursor: pointer;
        color: var(--color-text-placeholder);
        font-size: 14px;
    }

    .tip-close:hover {
        color: var(--color-error);
    }

    .tip-body {
        padding: var(--spacing-xl);
        line-height: 1.6;
    }

    .tip-body code {
        background: var(--color-bg-secondary);
        padding: 2px 6px;
        border-radius: var(--border-radius-sm);
        color: var(--color-error);
        font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, "Courier New", monospace;
    }

    .tip-group-title {
        font-weight: 600;
        color: var(--color-text-primary);
        font-size: 11px;
        margin: 8px 0 4px;
        padding-bottom: 3px;
        border-bottom: 1px solid var(--color-border);
    }

    .tip-group-title:first-child {
        margin-top: 0;
    }

    /* ========================================
       用例列表样式（GitHub风格）
       ======================================== */
    .case-list {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
    }

    .case-item {
        padding: 8px 12px;
        border-bottom: 1px solid var(--color-border-light);
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: background-color var(--transition-fast);
    }

    .case-item:hover {
        background: var(--color-bg-secondary);
    }

    .case-item.active {
        background: var(--color-bg-secondary);
        border-left: 4px solid var(--color-primary);
        padding-left: 8px;
    }

    .case-title {
        font-size: 12px;
        font-weight: 500;
        color: var(--color-text-primary);
    }

    .case-status {
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
    }

    .status-dot.pass {
        background: #1a7f37;
    }

    .status-dot.fail {
        background: #cf222e;
    }

    .status-dot.evalerror {
        background: #9e6a03;
    }

    .case-status-bar {
        padding: 8px 12px;
        font-size: 12px;
        color: var(--color-text-placeholder);
        text-align: center;
        background: var(--color-bg-secondary);
        border-top: 1px solid var(--color-border);
        flex: 0 0 auto;
    }

    /* ========================================
       导航操作按钮（返回/上一个/下一个）
       ======================================== */
    .nav-btn-group {
        display: flex;
        gap: var(--spacing-sm);
        padding: var(--spacing-md) var(--spacing-lg);
        border-bottom: 1px solid var(--color-border);
        flex: 0 0 auto;
    }

    .nav-btn {
        flex: 1;
        height: 24px;
        border: 1px solid var(--color-border-light);
        background: var(--color-bg-primary);
        border-radius: var(--border-radius-base);
        font-size: var(--font-size-xs);
        cursor: pointer;
        transition: all var(--transition-fast);
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        color: var(--color-text-secondary);
    }

    .nav-btn:hover {
        border-color: var(--color-primary);
        color: var(--color-primary);
        background: #f0f9ff;
    }

    .nav-btn-back {
        border-color: #c8e1ff;
        background: #f1f8ff;
        color: var(--color-primary);
    }

    .nav-btn-back:hover {
        background: var(--color-primary);
        color: #fff;
        border-color: var(--color-primary);
    }

    /* 归因菜单 */
    .attr-select {
        position: relative;
    }

    #attrMenu {
        position: absolute;
        left: 0;
        top: 100%;
        margin-top: 4px;
        width: 120px;
        background: #fff;
        border: 1px solid var(--color-border);
        border-radius: var(--border-radius-base);
        box-shadow: var(--shadow-md);
        display: none;
        z-index: 999;
    }

    #attrMenu.show {
        display: block;
    }

    .attr-item {
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
        transition: background .2s;
        color: var(--color-text-primary);
    }

    .attr-item:hover {
        background: var(--color-bg-secondary);
    }

    /* 指标筛选状态提示 */
    .metric-filter-notice {
        display: none;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        margin: 0 8px 8px 8px;
        background: #ddf4ff;
        border: 1px solid #79c0ff;
        border-radius: var(--border-radius-base);
        font-size: 12px;
        color: #0969da;
        gap: 8px;
        flex: 0 0 auto;
    }

    .metric-filter-notice span {
        flex: 1;
    }

    .metric-filter-clear-btn {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        padding: 0;
        border: none;
        background: none;
        color: #0969da;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        transition: color .2s;
        border-radius: var(--border-radius-sm);
    }

    .metric-filter-clear-btn:hover {
        color: #cf222e;
    }
</style>
