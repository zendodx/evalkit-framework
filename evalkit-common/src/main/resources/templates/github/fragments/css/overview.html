<!-- 总览面板样式 - GitHub风格指标卡片、图表 -->
<style th:fragment="overview">
    /* ========================================
       总览面板主体布局（GitHub风格）
       ======================================== */
    .overview {
        display: flex;
        flex: 1;
        overflow: hidden;
        background: #f6f8fa;
    }

    .overview-left {
        width: 50%;
        padding: 16px 16px;
        overflow-y: auto;
    }

    .overview-right {
        width: 50%;
        padding: 16px 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: #f6f8fa;
    }

    .report-name {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 16px;
        color: var(--color-text-primary);
    }

    /* ========================================
       指标卡片组（GitHub风格）
       ======================================== */
    .metric-name {
        font-size: 13px;
        font-weight: 600;
        margin: 12px 0 8px 0;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--color-border);
        color: var(--color-text-primary);
    }

    .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 8px;
    }

    .metric-card {
        padding: 12px;
        border: 1px solid var(--color-border);
        border-radius: var(--border-radius-base);
        background: var(--color-bg-primary);
        transition: all var(--transition-fast);
    }

    .metric-card:hover {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
    }

    .metric-label {
        font-size: 11px;
        color: var(--color-text-placeholder);
        margin-bottom: 4px;
    }

    .metric-value {
        font-size: 14px;
        font-weight: 600;
        color: var(--color-text-primary);
    }

    .metric-value.good {
        color: #1a7f37;
    }

    .metric-value.bad {
        color: #cf222e;
    }

    .metric-value.evalerror {
        color: #9e6a03;
    }

    /* ========================================
       图表样式（GitHub风格）
       ======================================== */
    .chart-box {
        flex: 1;
        background: var(--color-bg-primary);
        border: 1px solid var(--color-border);
        border-radius: var(--border-radius-base);
        padding: 12px;
        display: flex;
        flex-direction: column;
        transition: all var(--transition-fast);
    }

    .chart-box:hover {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
    }

    .chart-title {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 8px;
        text-align: center;
        color: var(--color-text-primary);
    }

    canvas {
        max-height: 180px;
    }
</style>
