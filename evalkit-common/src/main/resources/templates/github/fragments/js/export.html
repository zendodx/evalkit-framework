<!-- 导出功能 - 对话框管理、字段选择、导出执行 -->
<script th:fragment="export">
    /* ========================================
       导出功能全局状态
       ======================================== */
    const ExportState = {
        // 每个部分的字段列表
        fields: {
            inputData: [],
            businessData: [],
            evalData: []
        },
        // 选中的字段
        selected: {
            inputData: new Set(),
            businessData: new Set(),
            evalData: new Set()
        },
        // 每个部分是否被选中
        partSelected: {
            inputData: true,
            businessData: true,
            evalData: true
        },
        // 当前导出数据
        currentData: null
    };

    /* ========================================
       打开导出对话框
       ======================================== */
    function openExportDialog() {
        // 关闭菜单
        document.getElementById('attrMenu').classList.remove('show');

        // 初始化字段列表
        initializeExportFields();

        // 更新总数据量显示
        document.getElementById('exportTotalCount').textContent = evaluationData.length;

        // 重置导出参数
        document.getElementById('exportOffset').value = 0;
        document.getElementById('exportLimit').value = 0;

        // 显示对话框
        document.getElementById('exportDialogOverlay').style.display = 'flex';
    }

    /* ========================================
       关闭导出对话框
       ======================================== */
    function closeExportDialog() {
        document.getElementById('exportDialogOverlay').style.display = 'none';
    }

    /* ========================================
       初始化导出字段列表
       ======================================== */
    function initializeExportFields() {
        if (evaluationData && evaluationData.length > 0) {
            const sample = evaluationData[0];

            // 提取输入数据字段 - inputData.inputItem 包含实际的数据
            if (sample.inputData && sample.inputData.inputItem) {
                ExportState.fields.inputData = Object.keys(sample.inputData.inputItem);
                ExportState.selected.inputData = new Set(ExportState.fields.inputData);
            }

            // 提取业务接口数据字段 - apiCompletionResult 包含接口调用结果
            if (sample.apiCompletionResult) {
                const businessDataFields = [];
                Object.keys(sample.apiCompletionResult).forEach(key => {
                    // 如果是 resultItem (Map), 则平铺其字段
                    if (key === 'resultItem' && typeof sample.apiCompletionResult[key] === 'object' && sample.apiCompletionResult[key] !== null) {
                        Object.keys(sample.apiCompletionResult[key]).forEach(itemKey => {
                            businessDataFields.push(`resultItem.${itemKey}`);
                        });
                    } else {
                        businessDataFields.push(key);
                    }
                });
                ExportState.fields.businessData = businessDataFields;
                ExportState.selected.businessData = new Set(businessDataFields);
            }

            // 提取评测数据字段 - evalResult 包含评测结果
            if (sample.evalResult) {
                const evalDataFields = [];
                Object.keys(sample.evalResult).forEach(key => {
                    // 如果是 scorerResults (数组), 则为每个评估器创建字段
                    if (key === 'scorerResults' && Array.isArray(sample.evalResult[key])) {
                        sample.evalResult[key].forEach(scorer => {
                            if (scorer && scorer.metric) {
                                evalDataFields.push(`scorerResults.${scorer.metric}`);
                            }
                        });
                    } else {
                        evalDataFields.push(key);
                    }
                });
                ExportState.fields.evalData = evalDataFields;
                ExportState.selected.evalData = new Set(evalDataFields);
            }
        }

        // 渲染字段复选框
        renderExportFields();
    }

    /* ========================================
       渲染导出字段复选框
       ======================================== */
    function renderExportFields() {
        const parts = ['inputData', 'businessData', 'evalData'];

        parts.forEach(part => {
            const container = document.getElementById(`${part}Fields`);
            if (!container) return;

            container.innerHTML = '';
            const fields = ExportState.fields[part];

            fields.forEach(field => {
                const isSelected = ExportState.selected[part].has(field);
                const label = document.createElement('label');
                label.className = 'export-field-checkbox';
                label.innerHTML = `
                    <input type="checkbox" ${isSelected ? 'checked' : ''}
                           onchange="toggleFieldCheckbox('${part}', '${escapeQuote(field)}')" />
                    <span>${escapeHtml(field)}</span>
                `;
                container.appendChild(label);
            });
        });

        // 更新部分复选框状态
        updatePartCheckboxStates();
    }

    /* ========================================
       切换字段复选框
       ======================================== */
    function toggleFieldCheckbox(part, field) {
        if (ExportState.selected[part].has(field)) {
            ExportState.selected[part].delete(field);
        } else {
            ExportState.selected[part].add(field);
        }
        updatePartCheckboxStates();
    }

    /* ========================================
       切换部分复选框（整体选中/取消）
       ======================================== */
    function togglePartCheckbox(checkbox) {
        const part = checkbox.getAttribute('data-part');
        const isChecked = checkbox.checked;
        const container = document.getElementById(`${part}Fields`);

        ExportState.partSelected[part] = isChecked;

        if (isChecked) {
            // 全选当前部分的所有字段
            ExportState.selected[part] = new Set(ExportState.fields[part]);
        } else {
            // 取消选中当前部分的所有字段
            ExportState.selected[part].clear();
        }

        renderExportFields();
    }

    /* ========================================
       全选或反选字段
       ======================================== */
    function selectAllFields(part, selectAll) {
        if (selectAll) {
            // 全选
            ExportState.selected[part] = new Set(ExportState.fields[part]);
        } else {
            // 反选
            const allFields = ExportState.fields[part];
            const newSelected = new Set();
            allFields.forEach(field => {
                if (!ExportState.selected[part].has(field)) {
                    newSelected.add(field);
                }
            });
            ExportState.selected[part] = newSelected;
        }
        renderExportFields();
    }

    /* ========================================
       更新部分复选框状态
       ======================================== */
    function updatePartCheckboxStates() {
        const parts = ['inputData', 'businessData', 'evalData'];

        parts.forEach(part => {
            const checkbox = document.querySelector(`.export-part-checkbox[data-part="${part}"]`);
            if (checkbox) {
                const selectedCount = ExportState.selected[part].size;
                const totalCount = ExportState.fields[part].length;
                checkbox.checked = selectedCount > 0 && selectedCount === totalCount;
                checkbox.indeterminate = selectedCount > 0 && selectedCount < totalCount;
            }
        });
    }

    /* ========================================
       执行导出
       ======================================== */
    function executeExport() {
        // 获取导出格式
        const format = document.querySelector('input[name="exportFormat"]:checked').value;

        // 准备导出数据
        const exportData = prepareExportData();

        // 根据格式调用对应的导出方法
        switch (format) {
            case 'xlsx':
                exportToXLSX(exportData);
                break;
            case 'csv':
                exportToCSV(exportData);
                break;
            case 'json':
                exportToJSON(exportData);
                break;
        }

        // 关闭对话框
        closeExportDialog();
    }

    /* ========================================
       准备导出数据
       ======================================== */
    function prepareExportData() {
        const result = [];

        // 获取 offset 和 limit
        const offset = parseInt(document.getElementById('exportOffset').value) || 0;
        const limit = parseInt(document.getElementById('exportLimit').value) || 0;

        // 计算导出的数据范围
        const startIndex = offset;
        const endIndex = limit > 0 ? offset + limit : evaluationData.length;

        // 验证范围
        if (startIndex >= evaluationData.length) {
            return result; // 返回空结果
        }

        evaluationData.slice(startIndex, endIndex).forEach((item, index) => {
            const row = {
                '#': index + 1,
                'dataIndex': item.dataIndex || (index + 1)
            };

            // 添加选中的输入数据字段 - 从 inputData.inputItem 中获取
            if (ExportState.selected.inputData.size > 0 && item.inputData && item.inputData.inputItem) {
                ExportState.selected.inputData.forEach(field => {
                    row[`input_${field}`] = item.inputData.inputItem[field];
                });
            }

            // 添加选中的业务接口数据字段 - 从 apiCompletionResult 中获取
            if (ExportState.selected.businessData.size > 0 && item.apiCompletionResult) {
                ExportState.selected.businessData.forEach(field => {
                    let value;
                    // 处理 resultItem 平铺字段
                    if (field.startsWith('resultItem.')) {
                        const itemKey = field.substring('resultItem.'.length);
                        value = item.apiCompletionResult.resultItem && item.apiCompletionResult.resultItem[itemKey];
                    } else {
                        value = item.apiCompletionResult[field];
                    }
                    // 对于复杂对象，转换为JSON字符串
                    row[`api_${field}`] = typeof value === 'object' && value !== null ? JSON.stringify(value) : value;
                });
            }

            // 添加选中的评测数据字段 - 从 evalResult 中获取
            if (ExportState.selected.evalData.size > 0 && item.evalResult) {
                ExportState.selected.evalData.forEach(field => {
                    let value;
                    // 处理 scorerResults 数组字段
                    if (field.startsWith('scorerResults.')) {
                        const metricName = field.substring('scorerResults.'.length);
                        if (Array.isArray(item.evalResult.scorerResults)) {
                            const scorer = item.evalResult.scorerResults.find(s => s && s.metric === metricName);
                            value = scorer ? scorer : null;
                        }
                        // 对于 scorerResults，导出整个对象为 JSON
                        row[`eval_${field}`] = value ? JSON.stringify(value) : '';
                    } else {
                        value = item.evalResult[field];
                        // 对于其他复杂对象，转换为JSON字符串
                        row[`eval_${field}`] = typeof value === 'object' && value !== null ? JSON.stringify(value) : value;
                    }
                });
            }

            result.push(row);
        });

        return result;
    }

    /* ========================================
       导出为 JSON
       ======================================== */
    function exportToJSON(data) {
        const json = JSON.stringify(data, null, 2);
        const blob = new Blob([json], { type: 'application/json;charset=utf-8;' });
        downloadFile(blob, `evaluation-export-${getTimestamp()}.json`);
    }

    /* ========================================
       导出为 CSV
       ======================================== */
    function exportToCSV(data) {
        if (data.length === 0) {
            alert('没有数据可导出');
            return;
        }

        // 获取所有列名
        const headers = Object.keys(data[0]);

        // 生成 CSV 内容
        let csv = headers.map(h => `"${h.replace(/"/g, '""')}"`).join(',') + '\n';

        data.forEach(row => {
            const values = headers.map(h => {
                const val = row[h];
                if (val === null || val === undefined) {
                    return '';
                }
                const strVal = String(val).replace(/"/g, '""');
                return `"${strVal}"`;
            });
            csv += values.join(',') + '\n';
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        downloadFile(blob, `evaluation-export-${getTimestamp()}.csv`);
    }

    /* ========================================
       导出为 XLSX（使用简单的 SheetJS 库或后端API）
       ======================================== */
    function exportToXLSX(data) {
        // 如果没有 SheetJS 库，转换为 CSV 格式或调用后端 API
        // 这里使用一个简单的方案：调用后端 API

        // 首先尝试使用客户端库（如果可用）
        if (typeof XLSX !== 'undefined') {
            // 使用 SheetJS 库
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Evaluation');
            XLSX.writeFile(wb, `evaluation-export-${getTimestamp()}.xlsx`);
        } else {
            // 降级方案：导出为 CSV
            console.warn('SheetJS 库不可用，使用 CSV 格式导出');
            exportToCSV(data);
        }
    }

    /* ========================================
       文件下载助手
       ======================================== */
    function downloadFile(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    /* ========================================
       获取时间戳（用于生成文件名）
       ======================================== */
    function getTimestamp() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        return `${year}${month}${day}-${hours}${minutes}${seconds}`;
    }

    /* ========================================
       HTML 转义函数（用于显示字段名）
       ======================================== */
    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    /* ========================================
       HTML 特殊字符转义（用于 JavaScript 字符串）
       ======================================== */
    function escapeQuote(str) {
        return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    /* ========================================
       按键事件处理
       ======================================== */
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const overlay = document.getElementById('exportDialogOverlay');
            if (overlay && overlay.style.display === 'flex') {
                closeExportDialog();
            }
        }
    });

    /* ========================================
       对话框背景点击关闭
       ======================================== */
    document.addEventListener('click', function(e) {
        const overlay = document.getElementById('exportDialogOverlay');
        const dialog = document.querySelector('.export-dialog');

        if (overlay && overlay.style.display === 'flex' &&
            e.target === overlay && !dialog.contains(e.target)) {
            closeExportDialog();
        }
    }, true);
</script>
