<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>核心链路测试</title>

    <!-- 外部库（CDN）-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/json-viewer-js@1.0.8/dist/json-viewer.css"/>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/json-viewer-js@1.0.8/dist/json-viewer.min.js"></script>
    <script src="https://pfau-software.de/json-viewer/dist/iife/index.js"></script>

    <!-- 本页资源 -->
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<!-- 侧边栏 -->
<div class="sidebar">
    <div class="scroll-wrapper">
        <!-- 过滤器 -->
        <div class="filter">
            <div class="filter-btn-group">
                <div class="attr-select">
                    <button class="filter-btn" id="attrTrigger" onclick="toggleAttrMenu()">展开▼</button>
                    <div class="attr-menu" id="attrMenu">
                        <div class="attr-item" onclick="chooseAttr('old')">归因</div>
                        <div class="attr-item" onclick="chooseAttr('v2')">归因V2</div>
                    </div>
                </div>
                <button class="filter-btn" id="overviewBtn" onclick="renderOverview()">总览</button>
                <button class="filter-btn active" onclick="filterCases('all')">全部</button>
                <button class="filter-btn" onclick="filterCases('pass')">通过</button>
                <button class="filter-btn" onclick="filterCases('fail')">未通过</button>
            </div>
            <div class="filter-search">
                <div class="search-box">
                    <input id="caseSearch" type="text" placeholder="搜索用例（#序号/输入/结果/理由）" autocomplete="off"/>
                    <button id="clearSearch" title="清空">✕</button>
                </div>
                <button class="search-tip-btn" id="searchTipBtn" title="搜索语法">?</button>
            </div>
        </div>

        <!-- 用例列表 -->
        <div class="case-list" id="caseList"></div>

        <!-- 状态栏 + 提示浮层 -->
        <div class="case-status-bar">
            当前 <span id="caseCount">0</span> 条用例
        </div>
        <div class="search-tip-pop" id="searchTipPop">
            <div class="tip-header">
                搜索语法
                <span class="tip-close" id="tipClose">✕</span>
            </div>
            <div class="tip-body">
                <p><code>#99</code> 序号含 99</p>
                <p><code>超时 & 错误</code> 同时出现“超时”和“错误”</p>
                <p><code>超时 | 错误</code> 出现“超时”或“错误”</p>
                <p><code>!通过</code> 不含“通过”</p>
                <p><code>(超时 | 错误) & #123</code> 括号组合</p>
            </div>
        </div>
    </div>
</div>

<!-- 主内容区 -->
<div class="main-content">
    <!-- 总览 -->
    <div id="overviewContent" class="overview">
        <div class="overview-left">
            <div class="report-name">核心链路测试_2025-11-27T19:02:00</div>
            <div class="metric-name">基础指标</div>
            <div class="metrics-grid" id="basicMetricsGrid"></div>
            <div class="metric-name">接口调用指标</div>
            <div class="metrics-grid" id="completionMetricsGrid"></div>
            <div class="metric-name">评测指标</div>
            <div class="metrics-grid" id="evalMetricsGrid"></div>
            <div class="metric-name">大模型资源指标</div>
            <div class="metrics-grid" id="LLMMetricsGrid"></div>
        </div>
        <div class="overview-right">
            <div class="chart-box">
                <div class="chart-title">通过率趋势</div>
                <canvas id="passTrendChart" height="240"></canvas>
            </div>
            <div class="chart-box">
                <div class="chart-title">指标分布</div>
                <canvas id="distChart" height="240"></canvas>
            </div>
            <div class="chart-box">
                <div class="chart-title">接口TP指标</div>
                <canvas id="tpChart" height="240"></canvas>
            </div>
        </div>
    </div>

    <!-- 详情 / 归因 / V2 归因 -->
    <div id="detailContent" class="detail-panel">
        <div class="empty-state">选择左侧评测项查看详情</div>
    </div>
    <div id="attributeContent" class="attribute-content">
        <div class="empty-state">选择归因查看详情</div>
    </div>
    <div id="attributeV2Panel" style="display:none;">
        <div id="attributeV2Content">选择归因查看详情</div>
    </div>
</div>

<!-- 复制提示 -->
<div id="copyTip" class="copy-bubble">已复制</div>

<!-- 业务脚本 -->
<script src="js/app.js"></script>
</body>
</html>
