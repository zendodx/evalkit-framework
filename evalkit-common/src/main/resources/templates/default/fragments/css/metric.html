<!-- 指标统计面板样式 - 表格、卡片、柱形图 -->
<style th:fragment="metric">
    /* ========================================
       指标统计面板主体
       ======================================== */
    #metricCountPanel {
        flex: 1;
        padding: 3px;
        overflow-y: auto;
        background: #fafafa;
        overscroll-behavior: contain;
    }

    .metric-count-container {
        padding: 12px;
    }

    /* ========================================
       头部
       ======================================== */
    .metric-count-header {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
        flex: 1;
    }

    .metric-count-header h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
    }

    .metric-count-stat {
        font-size: 13px;
        color: #666;
        margin-left: 12px;
    }

    /* ========================================
       指标统计表格
       ======================================== */
    .metric-count-table-wrapper {
        background: #fff;
        border: 1px solid #e4e7ed;
        border-radius: 4px;
        padding: 12px;
        margin-bottom: 16px;
        overflow-x: auto;
    }

    .metric-count-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        text-align: left;
    }

    .metric-count-table th,
    .metric-count-table td {
        padding: 8px 12px;
        border: 1px solid #e4e7ed;
    }

    .metric-count-table th {
        background: #f5f7fa;
        font-weight: 600;
        color: #333;
    }

    .metric-count-table tbody tr:nth-child(even) {
        background: #fafbfc;
    }

    .metric-count-table tbody tr:hover {
        background: #f0f5ff;
    }

    .metric-count-table td {
        color: #606266;
    }

    /* ========================================
       指标卡片组
       ======================================== */
    .metric-cards-group {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 12px;
    }

    .metric-card-group {
        background: #fff;
        border: 1px solid #e4e7ed;
        border-radius: 4px;
        overflow: hidden;
        transition: all .2s;
    }

    .metric-card-group:hover {
        box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
    }

    .metric-card-group-header {
        padding: 12px 16px;
        background: #f5f7fa;
        font-weight: 600;
        font-size: 13px;
        color: #333;
        border-bottom: 1px solid #e4e7ed;
    }

    .metric-card-group-content {
        padding: 12px 16px;
    }

    /* ========================================
       指标统计行
       ======================================== */
    .metric-stat-row {
        display: flex;
        gap: 12px;
        margin-bottom: 12px;
    }

    .metric-stat-row:last-child {
        margin-bottom: 0;
    }

    .metric-stat-item {
        flex: 1;
        min-width: 0;
    }

    .metric-stat-label {
        font-size: 11px;
        color: #909399;
        margin-bottom: 4px;
    }

    .metric-stat-value {
        font-size: 13px;
        font-weight: 600;
        color: #606266;
    }

    .metric-stat-value.good {
        color: #67c23a;
    }

    .metric-stat-value.warning {
        color: #ff8010;
    }

    .metric-stat-value.bad {
        color: #f56c6c;
    }

    /* ========================================
       指标柱形图部分
       ======================================== */
    .metric-charts-section {
        margin-top: 24px;
        padding: 0;
    }

    .metric-charts-title {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 12px;
        padding: 0 12px;
        color: #333;
    }

    /* 图表容器网格 */
    .metric-charts-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
        gap: 12px;
        padding: 0 12px 12px 12px;
    }

    /* 单个图表卡片 */
    .metric-chart-item {
        background: #fff;
        border: 1px solid #e4e7ed;
        border-radius: 4px;
        padding: 12px;
        min-height: 180px;
        display: flex;
        flex-direction: column;
        transition: all .2s;
    }

    .metric-chart-item:hover {
        box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
    }

    /* 图表名称 */
    .metric-chart-name {
        font-size: 12px;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid #f0f0f0;
    }

    /* 图表画布 */
    .metric-chart-item canvas {
        width: 100% !important;
        height: auto !important;
        flex: 1;
        min-height: 140px;
    }
</style>
