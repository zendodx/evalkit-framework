<!-- 侧边栏样式 - 过滤器、搜索、用例列表 -->
<style th:fragment="sidebar">
    /* ========================================
       过滤器样式
       ======================================== */
    .filter-section {
        padding: var(--spacing-md) var(--spacing-lg);
        border-bottom: 1px solid var(--color-border);
        display: flex;
        gap: var(--spacing-sm);
        flex-direction: column;
        flex: 0 0 auto;
    }

    .filter-btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: var(--spacing-md);
    }

    .filter-btn {
        flex: 1;
        height: 24px;
        border: 1px solid var(--color-border-light);
        background: var(--color-bg-primary);
        border-radius: var(--border-radius-base);
        font-size: var(--font-size-xs);
        cursor: pointer;
        transition: all var(--transition-fast);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .filter-btn:hover {
        border-color: var(--color-primary);
        color: var(--color-primary);
    }

    .filter-btn.active {
        background: var(--color-primary);
        color: var(--color-bg-primary);
        border-color: var(--color-primary);
    }

    /* ========================================
       搜索框样式
       ======================================== */
    .search-section {
        display: flex;
        align-items: center;
        gap: var(--spacing-sm);
        margin-top: var(--spacing-sm);
    }

    .search-box {
        position: relative;
        flex: 1;
        min-width: 0;
    }

    .search-input {
        width: 100%;
        height: 25px;
        font-size: var(--font-size-sm);
        border: 1px solid var(--color-border-light);
        border-radius: var(--border-radius-base);
        outline: none;
        padding: 0 28px 0 var(--spacing-lg);
        transition: border-color var(--transition-fast);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: var(--color-bg-primary);
    }

    .search-input:focus {
        border-color: var(--color-primary);
    }

    .search-clear-btn {
        position: absolute;
        top: 50%;
        right: var(--spacing-sm);
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        line-height: 18px;
        text-align: center;
        border: none;
        background: none;
        color: var(--color-text-placeholder);
        cursor: pointer;
        font-size: 14px;
        transition: color var(--transition-fast);
    }

    .search-clear-btn:hover {
        color: var(--color-error);
    }

    .highlight {
        background: #ffeeba;
        color: #d75050;
        padding: 0 var(--spacing-xs);
        border-radius: var(--border-radius-sm);
    }

    /* 搜索框提示按钮 */
    .search-tip-btn {
        width: 18px;
        height: 18px;
        border: 1px solid #d9ecff;
        background: #ecf5ff;
        color: #409eff;
        border-radius: 50%;
        cursor: pointer;
        font-size: 12px;
        line-height: 0;
        text-align: center;
        transition: all .2s;
    }

    .search-tip-btn:hover {
        background: #409eff;
        color: #fff;
    }

    /* 搜索提示弹出框 */
    .search-tip-pop {
        position: absolute;
        top: 36px;
        left: 240px;
        width: 260px;
        background: #fff;
        border: 1px solid #e4e7ed;
        border-radius: 4px;
        box-shadow: 0 4px 12px rgba(0, 0, 0, .15);
        font-size: 12px;
        z-index: 999;
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s;
    }

    .search-tip-pop.show {
        opacity: 1;
        pointer-events: auto;
    }

    .tip-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid #e4e7ed;
        font-weight: 600;
        color: #303133;
    }

    .tip-close {
        cursor: pointer;
        color: #909399;
        font-size: 14px;
    }

    .tip-close:hover {
        color: #f56c6c;
    }

    .tip-body {
        padding: 12px;
        line-height: 1.6;
    }

    .tip-body code {
        background: #f4f4f5;
        padding: 2px 4px;
        border-radius: 2px;
        color: #d75050;
    }

    /* ========================================
       用例列表样式
       ======================================== */
    .case-list {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
    }

    .case-item {
        padding: 6px 8px;
        border-bottom: 1px solid #f0f2f5;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .case-item:hover {
        background: #f5f7fa;
    }

    .case-item.active {
        background: #ecf5ff;
        color: #409eff;
    }

    .case-title {
        font-size: 12px;
        font-weight: 500;
    }

    .case-status {
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
    }

    .status-dot.pass {
        background: #67c23a;
    }

    .status-dot.fail {
        background: #f56c6c;
    }

    .status-dot.evalerror {
        background: #ff8010;
    }

    .case-status-bar {
        padding: 8px 12px;
        font-size: 12px;
        color: #909399;
        text-align: center;
        background: #fafafa;
        border-top: 1px solid #e4e7ed;
        flex: 0 0 auto;
    }

    /* ========================================
       导航操作按钮（返回/上一个/下一个）
       ======================================== */
    .nav-btn-group {
        display: flex;
        gap: var(--spacing-sm);
        padding: var(--spacing-md) var(--spacing-lg);
        border-bottom: 1px solid var(--color-border);
        flex: 0 0 auto;
    }

    .nav-btn {
        flex: 1;
        height: 24px;
        border: 1px solid var(--color-border-light);
        background: var(--color-bg-primary);
        border-radius: var(--border-radius-base);
        font-size: var(--font-size-xs);
        cursor: pointer;
        transition: all var(--transition-fast);
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
        color: var(--color-text-secondary);
    }

    .nav-btn:hover {
        border-color: var(--color-primary);
        color: var(--color-primary);
        background: #ecf5ff;
    }

    .nav-btn-back {
        border-color: #d9ecff;
        background: #f0f9ff;
        color: #409eff;
    }

    .nav-btn-back:hover {
        background: #409eff;
        color: #fff;
        border-color: #409eff;
    }

    /* 归因菜单 */
    .attr-select {
        position: relative;
    }

    #attrMenu {
        position: absolute;
        left: 0;
        top: 100%;
        margin-top: 4px;
        width: 100px;
        background: #fff;
        border: 1px solid #dcdfe6;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
        display: none;
        z-index: 999;
    }

    #attrMenu.show {
        display: block;
    }

    .attr-item {
        padding: 6px 10px;
        font-size: 11px;
        cursor: pointer;
        transition: background .2s;
    }

    .attr-item:hover {
        background: #f5f7fa;
    }

    /* 指标筛选状态提示 */
    .metric-filter-notice {
        display: none;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        margin: 0 8px 8px 8px;
        background: #e6f7ff;
        border: 1px solid #b3e5fc;
        border-radius: 3px;
        font-size: 12px;
        color: #0277bd;
        gap: 8px;
        flex: 0 0 auto;
    }

    .metric-filter-notice span {
        flex: 1;
    }

    .metric-filter-clear-btn {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        padding: 0;
        border: none;
        background: none;
        color: #0277bd;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        transition: color .2s;
        border-radius: 2px;
    }

    .metric-filter-clear-btn:hover {
        color: #01579b;
        background: rgba(1, 87, 155, 0.1);
    }
</style>
