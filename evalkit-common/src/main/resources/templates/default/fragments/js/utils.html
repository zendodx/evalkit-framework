<!-- 工具函数库 - 格式化、时间、HTML转义、防抖等 -->
<script th:fragment="utils">
    /* ========================================
       数字/时间格式化工具
       ======================================== */
    function formatNumber(value, decimals = AppState.config.decimalPlaces) {
        return typeof value === 'number' ? value.toFixed(decimals) : '-';
    }

    function formatPrice(value) {
        return formatNumber(value, AppState.config.priceDecimalPlaces);
    }

    function formatTime(ms) {
        return typeof ms === 'number' ? `${formatNumber(ms)}ms` : '-';
    }

    function formatPercentage(value) {
        return typeof value === 'number' ? `${formatNumber(value * 100)}%` : '-';
    }

    /* ========================================
       时间戳格式化
       ======================================== */
    function fmt(ts) {
        if (!ts) return '-';
        const d = new Date(ts);
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function pad(n) {
        return n < 10 ? '0' + n : n;
    }

    /* ========================================
       HTML转义和文本处理
       ======================================== */
    function escapeHtml(str) {
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function highlightText(text, keyword) {
        if (!keyword) return text;
        return text.replace(new RegExp(`(${keyword})`, 'gi'), '<span class="highlight">$1</span>');
    }

    /* ========================================
       防抖函数
       ======================================== */
    function debounce(func, wait) {
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(AppState.search.debounceTimer);
                func(...args);
            };
            clearTimeout(AppState.search.debounceTimer);
            AppState.search.debounceTimer = setTimeout(later, wait);
        };
    }

    /* ========================================
       搜索清除和筛选提示
       ======================================== */
    function clearSearch() {
        AppState.search.keyword = '';
        AppState.search.input.value = '';
        renderCaseList();
    }

    function showMetricFilterNotice(metricName, status, caseCount) {
        const tip = document.getElementById('copyTip');
        const statusText = status === 'pass' ? '通过' : '失败';
        tip.textContent = `已筛选: ${metricName} - ${statusText} (${caseCount}个用例)`;
        tip.classList.add('show');
        setTimeout(() => tip.classList.remove('show'), 3000);
    }

    function clearMetricFilter() {
        AppState.metricFilter.metricName = null;
        AppState.metricFilter.metricStatus = null;
        AppState.metricFilter.filterCaseIds = [];
        renderCaseList();
    }

    /* ========================================
       面板显示/隐藏控制
       ======================================== */
    function showPanel(name) {
        document.getElementById('overviewContent').style.display = name === 'overview' ? 'flex' : 'none';
        document.getElementById('detailContent').style.display = name === 'detail' ? '' : 'none';
        document.getElementById('attributeContent').style.display = name === 'attribute' ? '' : 'none';
        document.getElementById('attributeV2Panel').style.display = name === 'attributeV2Panel' ? '' : 'none';
        document.getElementById('metricCountPanel').style.display = name === 'metricCountPanel' ? '' : 'none';
    }

    /* ========================================
       图表销毁
       ======================================== */
    function destroyChart(chartName) {
        if (AppState.charts[chartName]) {
            AppState.charts[chartName].destroy();
            AppState.charts[chartName] = null;
        }
    }

    function destroyAllMetricCharts() {
        Object.values(metricCharts).forEach(chart => {
            if (chart && typeof chart.destroy === 'function') {
                chart.destroy();
            }
        });
        metricCharts = {};
    }

    /* ========================================
       按钮激活状态管理
       ======================================== */
    function setActiveButton(buttonId) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));

        let targetButton;
        switch (buttonId) {
            case 'all':
            case 'pass':
            case 'fail':
                targetButton = document.querySelector(`[onclick="filterCases('${buttonId}')"]`);
                break;
            case 'overviewBtn':
                targetButton = document.getElementById('overviewBtn');
                break;
            case 'attrTrigger':
                targetButton = document.getElementById('attrTrigger');
                break;
            default:
                return;
        }

        if (targetButton) {
            targetButton.classList.add('active');
        }
    }

    /* ========================================
       URL 导航工具
       ======================================== */
    function updateUrlWithCurrentCase() {
        if (!AppState.selectedCase) return;

        const url = new URL(location.href);
        url.searchParams.set('dataIndex', AppState.selectedCase.inputData.dataIndex);
        window.history.replaceState(null, '', url);
    }

    function toggleAttrMenu() {
        const menu = document.getElementById('attrMenu');
        menu.classList.toggle('show');
    }

    function chooseAttr(version) {
        // 关闭菜单
        document.getElementById('attrMenu').classList.remove('show');
        // 清除所有按钮的激活状态
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('attrTrigger').classList.add('active');

        // 执行对应的渲染函数
        if (version === 'old') renderAttribute();
        if (version === 'v2') renderAttributeV2();
    }

    /* ========================================
       快捷键处理 - 上一个/下一个用例
       ======================================== */
    function handleKeyboardShortcuts(e) {
        // 不在输入框中时才响应快捷键
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            return;
        }

        // ArrowUp 或 K 键：上一个用例
        if ((e.key === 'ArrowUp' || e.key.toUpperCase() === 'K') && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            navigateToPreviousCase();
        }
        // ArrowDown 或 J 键：下一个用例
        else if ((e.key === 'ArrowDown' || e.key.toUpperCase() === 'J') && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            navigateToNextCase();
        }
        // ? 键：显示快捷键帮助（可选）
        else if (e.key === '?' && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            showKeyboardHelp();
        }
    }

    /* ========================================
       导航到上一个用例
       ======================================== */
    function navigateToPreviousCase() {
        if (!AppState.selectedCase) return;

        // 获取当前过滤后的用例列表
        const filteredData = filterCaseData();
        if (filteredData.length === 0) return;

        // 找到当前用例在过滤列表中的索引
        const currentIndex = filteredData.findIndex(item => item.dataIndex === AppState.selectedCase.dataIndex);

        // 如果找到且不是第一个，则切换到前一个
        if (currentIndex > 0) {
            selectCase(filteredData[currentIndex - 1].dataIndex);
        }
        // 如果是第一个，循环到最后一个
        else if (currentIndex === 0 && filteredData.length > 1) {
            selectCase(filteredData[filteredData.length - 1].dataIndex);
        }
    }

    /* ========================================
       导航到下一个用例
       ======================================== */
    function navigateToNextCase() {
        if (!AppState.selectedCase) return;

        // 获取当前过滤后的用例列表
        const filteredData = filterCaseData();
        if (filteredData.length === 0) return;

        // 找到当前用例在过滤列表中的索引
        const currentIndex = filteredData.findIndex(item => item.dataIndex === AppState.selectedCase.dataIndex);

        // 如果找到且不是最后一个，则切换到后一个
        if (currentIndex >= 0 && currentIndex < filteredData.length - 1) {
            selectCase(filteredData[currentIndex + 1].dataIndex);
        }
        // 如果是最后一个，循环到第一个
        else if (currentIndex === filteredData.length - 1 && filteredData.length > 1) {
            selectCase(filteredData[0].dataIndex);
        }
    }

    /* ========================================
       显示键盘快捷键帮助
       ======================================== */
    function showKeyboardHelp() {
        const tip = document.getElementById('copyTip');
        if (!tip) return;

        const helpText = '⬆/K: 上一个用例 | ⬇/J: 下一个用例';
        const originalText = tip.textContent;
        const originalClass = tip.className;

        tip.textContent = helpText;
        tip.classList.add('show');

        // 3秒后恢复
        setTimeout(() => {
            tip.classList.remove('show');
            setTimeout(() => {
                tip.textContent = originalText;
                tip.className = originalClass;
            }, 200);
        }, 3000);
    }
</script>
