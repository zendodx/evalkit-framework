<!-- 详情面板渲染 - 用例详情、JSON数据展示 -->
<script th:fragment="renderDetail">
    /* ========================================
       URL 导航处理
       ======================================== */
    function handleUrlNavigation() {
        const params = new URLSearchParams(location.search);
        const dataIndex = params.get('dataIndex');

        if (dataIndex == null) return;

        const targetCase = evaluationData.find(d => String(d.dataIndex) === dataIndex);
        if (!targetCase) return;

        navigateToCase(targetCase);
    }

    function navigateToCase(targetCase) {
        AppState.currentFilter = 'all';
        AppState.selectedCase = targetCase;
        renderCaseList();
        renderDetail();
    }

    /* ========================================
       详情面板主渲染函数
       ======================================== */
    function renderDetail() {
        if (!AppState.selectedCase) return;
        showPanel('detail');
        const d = AppState.selectedCase;
        const evalResult = d.evalResult || {};
        const pass = evalResult.pass;
        const success = evalResult.success;
        const score = formatNumber(evalResult.score);
        const scoreStrategyName = evalResult.scoreStrategyName || '-';
        const threshold = evalResult.threshold || '-';

        let statusClass, statusText, metricClass;
        if (pass === true) {
            statusClass = 'pass';
            statusText = '通过';
            metricClass = 'good';
        } else if (success === true) {
            statusClass = 'fail';
            statusText = '未通过';
            metricClass = 'bad';
        } else {
            statusClass = 'evalerror';
            statusText = '评测错误';
            metricClass = 'evalerror';
        }

        document.getElementById('detailContent').innerHTML = `
      <div class="detail-panel">
          <!-- 详情头部 -->
          <div class="detail-header">
            <span class="datail-dataindex">#${d.inputData.dataIndex}</span>
            <span class="metric-badge ${statusClass}">${statusText}</span>
            <span class="metric-value ${metricClass}">${score}</span>
            <!-- 打分策略名称和阈值 -->
            <span class="detail-strategy">${scoreStrategyName}, 阈值: ${threshold}</span>
           <!-- 快速跳转按钮 -->
           <div class="header-jumps">
             <a href="#section-input"   class="jump-btn">输入数据</a>
             <a href="#section-api"     class="jump-btn">API调用结果</a>
             <a href="#section-eval"    class="jump-btn">评测结果</a>
             <a href="#section-scorer"  class="jump-btn">评测详情</a>
           </div>
            <!-- 分享按钮 -->
           <span class="share-btn" onclick="shareCase()" title="分享链接">
              <svg class="share-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3s3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
           </span>
          </div>
          <!-- 详情内容区 -->
          <div class="detail-content-scroll">
            ${section('输入数据', jsonDiv(d.inputData.inputItem))}
            ${section('API调用结果', apiDiv(d.apiCompletionResult))}
            ${section('评测结果', evalDiv(d.evalResult))}
            ${section('评测详情', scorerDiv(evalResult.scorerResults))}
          </div>
      </div>
`;

        // 激活 json-viewer
        document.querySelectorAll('pre.json-viewer').forEach(el => new JsonViewer(el));
    }

    /* ========================================
       选择用例
       ======================================== */
    function selectCase(idx) {
        // 保存当前滚动位置（获取 .detail-content-scroll 的滚动位置）
        let scrollPosition = 0;
        const scrollContainer = document.querySelector('.detail-content-scroll');
        if (scrollContainer) {
            scrollPosition = scrollContainer.scrollTop;
        }

        AppState.selectedCase = evaluationData.find(d => d.dataIndex === idx);
        renderCaseList();
        renderDetail();

        // 恢复滚动位置
        requestAnimationFrame(() => {
            const newScrollContainer = document.querySelector('.detail-content-scroll');
            if (newScrollContainer) {
                newScrollContainer.scrollTop = scrollPosition;
            }
        });

        // 同步 URL
        const url = new URL(location.href);
        url.searchParams.set('dataIndex', idx);
        window.history.replaceState(null, '', url);
    }

    /* ========================================
       分享用例链接
       ======================================== */
    function shareCase() {
        const url = new URL(location.href);
        navigator.clipboard.writeText(url.href).then(() => {
            const tip = document.getElementById('copyTip');
            tip.classList.add('show');
            setTimeout(() => tip.classList.remove('show'), 1500);
        });
    }

    /* ========================================
       来源面板记录（用于"返回"按钮）
       ======================================== */
    const NavSource = {
        panelName: null,      // 来源面板名称，如 'attributeV2Panel'、'attribute'、'overview'
        scrollTop: 0,         // 来源面板的滚动位置
        // 记录当前面板为来源
        record(panelName) {
            this.panelName = panelName;
            // 获取来源面板的滚动位置
            const el = panelName ? document.getElementById(panelName) : null;
            this.scrollTop = el ? el.scrollTop : 0;
        },
        // 恢复来源面板（不重渲染）
        restore() {
            if (!this.panelName) return false;
            showPanel(this.panelName);
            updateNavButtons();
            // 恢复滚动位置
            const savedScrollTop = this.scrollTop;
            requestAnimationFrame(() => {
                const el = document.getElementById(this.panelName);
                if (el) el.scrollTop = savedScrollTop;
            });
            this.panelName = null;
            return true;
        }
    };

    /* ========================================
       跳转到指定用例
       ======================================== */
    function jumpToCase(dataIndex) {
        // 记录来源面板（不重渲染版）
        const currentPanel = AppState._currentPanel || null;
        NavSource.record(currentPanel);

        // 记录跳转前的 URL（用于浏览器历史）
        const prevUrl = new URL(location.href);

        AppState.currentFilter = 'all';
        renderCaseList();
        AppState.selectedCase = evaluationData.find(c => c.dataIndex === dataIndex);
        renderDetail();
        showPanel('detail');
        renderCaseList();

        // 跳转到详情顶部
        requestAnimationFrame(() => {
            const scrollContainer = document.querySelector('.detail-content-scroll');
            if (scrollContainer) {
                scrollContainer.scrollTop = 0;
            }
        });

        // 使用 pushState 压入历史，使浏览器后退按钮可以返回来源面板
        if (AppState.selectedCase) {
            const url = new URL(location.href);
            url.searchParams.set('dataIndex', AppState.selectedCase.inputData.dataIndex);
            // 如果当前 URL 已经是同一个 dataIndex，则 replace 避免重复入栈
            if (prevUrl.href === url.href) {
                window.history.replaceState({panel: 'detail', dataIndex}, '', url);
            } else {
                window.history.pushState({panel: 'detail', dataIndex}, '', url);
            }
        }
    }

    /* ========================================
       返回来源面板（保留原始展示状态，不重渲染）
       ======================================== */
    function navBack() {
        if (!NavSource.restore()) {
            // 没有记录来源时，浏览器后退
            window.history.back();
        }
    }

    /* ========================================
       监听浏览器后退/前进，恢复面板状态
       ======================================== */
    window.addEventListener('popstate', function (e) {
        const params = new URLSearchParams(location.search);
        const dataIndex = params.get('dataIndex');

        if (dataIndex != null) {
            // 有 dataIndex 参数：显示对应用例详情
            const targetCase = evaluationData.find(d => String(d.inputData.dataIndex) === dataIndex);
            if (targetCase) {
                AppState.currentFilter = 'all';
                AppState.selectedCase = targetCase;
                renderCaseList();
                renderDetail();
                showPanel('detail');
                requestAnimationFrame(() => {
                    const scrollContainer = document.querySelector('.detail-content-scroll');
                    if (scrollContainer) scrollContainer.scrollTop = 0;
                });
            }
        } else {
            // 无 dataIndex：回退到归因 V2 面板（或其他来源面板）
            const state = e.state;
            if (state && state.panel === 'attributeV2') {
                renderAttributeV2();
            } else if (state && state.panel === 'attribute') {
                renderAttribute();
            } else {
                // 默认回到总览
                renderOverview();
            }
        }
    });

    /* ========================================
       详情分组 HTML 生成
       ======================================== */
    function section(title, content) {
        const id = 'section-' + ({
            '输入数据': 'input',
            'API调用结果': 'api',
            '评测结果': 'eval',
            '评测详情': 'scorer'
        }[title] || 'other');
        return `<div class="detail-section" id="${id}">
              <div class="detail-section-header">${title}</div>
              <div class="detail-section-content">${content}</div>
            </div>`;
    }

    /* ========================================
       JSON 数据展示
       ======================================== */
    function jsonDiv(obj) {
        if (!obj) {
            return `<span>没有输入数据</span>`
        }
        return `<div>
                    <andypf-json-viewer
                            show-toolbar="true"
                            show-data-types="false"
                            theme="github"
                            expanded="3"
                            data="${escapeHtml(JSON.stringify(obj, null, 2))}">
                    </andypf-json-viewer>
               </div>`
    }

    /* ========================================
       API 调用结果展示
       ======================================== */
    function apiDiv(r) {
        if (!r) {
            return `<span>没有API调用结果</span>`
        }
        return `
          <div class="detail-row"><div class="detail-label">耗时</div><div class="detail-value">${r.timeCost}ms</div></div>
          <div class="detail-row"><div class="detail-label">时间</div><div class="detail-value">${fmt(r.startTime)} / ${fmt(r.endTime)}</div></div>
          <div class="detail-row"><div class="detail-label">状态</div><div class="detail-value">${r.success ? '<span style="color:#67c23a">正常</span>' : '<span style="color:#f56c6c">出错</span>'}</div></div>
          ${r.resultItem ? jsonDiv(r.resultItem) : ''}`;
    }

    /* ========================================
       评测结果展示
       ======================================== */
    function evalDiv(r) {
        if (!r) {
            return `<span>没有评测结果</span>`;
        }
        const pass = r.pass === true;
        const score = formatNumber(r.score);
        const reason = r.reason || '-';
        const scoreStrategyName = r.scoreStrategyName || '-';
        const threshold = typeof r.threshold === 'number' ? r.threshold : '-';
        const timeCost = typeof r.timeCost === 'number' ? r.timeCost + 'ms' : '-';
        const startTime = r.startTime ? fmt(r.startTime) : '-';
        const endTime = r.endTime ? fmt(r.endTime) : '-';
        const success = r.success === true;
        const statusHtml = success
            ? '<span style="color:#67c23a">正常</span>'
            : '<span style="color:#f56c6c">出错</span>';

        return `
      <div class="detail-row"><div class="detail-label">分数</div><div class="detail-value metric-value ${pass ? 'good' : 'bad'}">${score}</div></div>
      <div class="detail-row"><div class="detail-label">理由</div><div class="detail-value">${reason}</div></div>
      <div class="detail-row"><div class="detail-label">策略</div><div class="detail-value">${scoreStrategyName}</div></div>
      <div class="detail-row"><div class="detail-label">阈值</div><div class="detail-value">${threshold}</div></div>
      <div class="detail-row"><div class="detail-label">耗时</div><div class="detail-value">${timeCost}</div></div>
      <div class="detail-row"><div class="detail-label">时间</div><div class="detail-value">${startTime} / ${endTime}</div></div>
      <div class="detail-row"><div class="detail-label">状态</div><div class="detail-value">${statusHtml}</div></div>
    `;
    }

    /* ========================================
       评估器结果展示（按 scorerType 分类渲染）
       ======================================== */
    function scorerDiv(list) {
        if (!list || list.length === 0) {
            return `<span>没有评估器</span>`;
        }
        return list.map(s => {
            if (s.scorerType === 'rubricBasedScorer') {
                return rubricScorerDiv(s);
            }
            return defaultScorerDiv(s);
        }).join('');
    }

    /* ========================================
       默认评估器渲染（通用）
       ======================================== */
    function defaultScorerDiv(s) {
        const pass = s.pass;
        return `<div style="margin-bottom:6px;padding:6px;border-left:3px solid ${pass ? '#67c23a' : '#f56c6c'};background:${pass ? '#e1f3d8' : '#fde2e2'};border-radius:2px;">
                  <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600">
                    <div>
                        <span>${s.metric}${s.star ? '<span style="color:#ff4757;margin-left:4px">必过</span>' : ''}</span>
                        <span>${s.success ? '' : '<span style="color:#ff4757;margin-left:4px">评测出错</span>'}</span>
                    </div>
                    <span class="metric-badge ${pass ? 'pass' : 'fail'}">${pass ? '通过' : '未通过'} | 阈值 ${s.threshold} | 得分率 ${formatNumber(s.scoreRate)} | 得分 ${formatNumber(s.score)} / ${formatNumber(s.totalScore)}</span>
                  </div>
                  <div style="font-size:12px;color:#606266;margin:5px 0">${s.reason}</div>
                  ${s.extra ? (() => {
                      const map = wrapperScorerResultExtra(s.extra);
                      return jsonDiv(map);
                  })() : ''}
                </div>`;
    }

    /* ========================================
       RubricBasedScorer 专属渲染（保持原卡片样式，追加维度表格）
       ======================================== */
    function rubricScorerDiv(s) {
        const pass = s.pass;
        const extra = s.extra || {};

        // 从 extra 中解析各维度数据
        const rawScores   = parseJsonField(extra['rubric_criteria_raw_scores']);
        const normScores  = parseJsonField(extra['rubric_criteria_norm_scores']);
        const passRates   = parseJsonField(extra['rubric_criteria_pass_rates']);
        const reasons     = parseJsonField(extra['rubric_criteria_reasons']);
        const reasonings  = parseJsonField(extra['rubric_criteria_reasonings']);

        // 收集所有维度名称（保持顺序）
        const criteriaNames = Object.keys(rawScores || normScores || reasons || {});
        const tableHtml = criteriaNames.length > 0
            ? buildRubricTable(criteriaNames, rawScores, normScores, passRates, reasons, reasonings)
            : '';

        // 完整 extra 原始数据展示在表格下方（含 rubric 专属字段，方便调试）
        const extraHtml = Object.keys(extra).length > 0
            ? `<div style="margin-top:10px">${jsonDiv(extra)}</div>`
            : '';

        return `<div style="margin-bottom:6px;padding:6px;border-left:3px solid ${pass ? '#67c23a' : '#f56c6c'};background:${pass ? '#e1f3d8' : '#fde2e2'};border-radius:2px;">
                  <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600">
                    <div>
                        <span>${s.metric}${s.star ? '<span style="color:#ff4757;margin-left:4px">必过</span>' : ''}</span>
                        <span>${s.success ? '' : '<span style="color:#ff4757;margin-left:4px">评测出错</span>'}</span>
                    </div>
                    <span class="metric-badge ${pass ? 'pass' : 'fail'}">${pass ? '通过' : '未通过'} | 阈值 ${s.threshold} | 得分率 ${formatNumber(s.scoreRate)} | 得分 ${formatNumber(s.score)} / ${formatNumber(s.totalScore)}</span>
                  </div>
                  <div style="font-size:12px;color:#606266;margin-top:6px;margin-bottom:${tableHtml ? '0' : '2px'}">${s.reason}</div>
                  ${tableHtml ? `<div style="margin-top:8px">${tableHtml}</div>` : ''}
                  ${extraHtml}
                </div>`;
    }

    /* 构建维度数据表格（全 inline style，不依赖主题 CSS） */
    function buildRubricTable(criteriaNames, rawScores, normScores, passRates, reasons, reasonings) {
        const tdBase = 'padding:4px 6px;border-bottom:1px solid rgba(0,0,0,0.06);vertical-align:top;font-size:11px;word-break:break-word;';

        const rows = criteriaNames.map(name => {
            const raw      = rawScores  ? formatNumber(rawScores[name])  : '-';
            const norm     = normScores ? formatNumber(normScores[name]) : '-';
            const normVal  = normScores ? (normScores[name] || 0) : 0;
            // 优先使用后端透传的真实 passRate，如果没有则默认 1.0（即必须满分）
            const passRate = passRates ? (passRates[name] != null ? passRates[name] : 1.0) : 1.0;
            const reason   = reasons   ? (reasons[name]  || '-') : '-';
            const reasoning = reasonings ? (reasonings[name] || '') : '';

            const isSkipped = reason === '[skipped]';

            const passCell = isSkipped
                ? `<span style="color:#909399;font-style:italic">跳过</span>`
                : (normVal >= passRate
                    ? `<span style="color:#67c23a;font-weight:600">✓</span>`
                    : `<span style="color:#f56c6c;font-weight:600">✗</span>`);

            // 进度条
            const barColor = normVal >= passRate ? '#67c23a' : '#f56c6c';
            const normCell = `<div style="display:flex;align-items:center;gap:5px">
                                <div style="flex:1;height:5px;background:#ddd;border-radius:3px;overflow:hidden;min-width:36px">
                                  <div style="height:100%;width:${Math.round(normVal * 100)}%;background:${barColor};border-radius:3px"></div>
                                </div>
                                <span style="font-size:11px;color:#606266;white-space:nowrap">${norm}</span>
                              </div>`;

            // reasoning 折叠展示
            const reasoningHtml = reasoning && !isSkipped
                ? `<details style="margin-top:3px">
                     <summary style="cursor:pointer;color:#909399;font-size:11px;user-select:none">推理过程</summary>
                     <div style="margin-top:3px;padding:4px 6px;background:rgba(0,0,0,0.04);border-radius:2px;color:#606266;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word">${escapeHtml(reasoning)}</div>
                   </details>`
                : '';

            return `<tr>
                      <td style="${tdBase}font-weight:600;color:#303133">${escapeHtml(name)}</td>
                      <td style="${tdBase}color:#409eff;font-weight:600">${raw}</td>
                      <td style="${tdBase}">${normCell}</td>
                      <td style="${tdBase}text-align:center">${passCell}</td>
                      <td style="${tdBase}color:#606266">
                        ${isSkipped ? '<span style="color:#909399;font-style:italic">条件不满足，已跳过</span>' : escapeHtml(reason)}
                        ${reasoningHtml}
                      </td>
                    </tr>`;
        }).join('');

        const thBase = 'padding:4px 6px;background:rgba(0,0,0,0.04);font-weight:600;color:#909399;text-align:left;font-size:11px;white-space:nowrap;border-bottom:1px solid rgba(0,0,0,0.08);';

        return `<table style="width:100%;border-collapse:collapse;table-layout:fixed">
                  <colgroup>
                    <col style="width:13%">
                    <col style="width:9%">
                    <col style="width:17%">
                    <col style="width:7%">
                    <col style="width:54%">
                  </colgroup>
                  <thead>
                    <tr>
                      <th style="${thBase}">维度</th>
                      <th style="${thBase}">原始分</th>
                      <th style="${thBase}">归一化</th>
                      <th style="${thBase}text-align:center">达标</th>
                      <th style="${thBase}">理由</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>`;
    }

    /* 解析 extra 中的字段（可能是 JSON 字符串或已解析的对象） */
    function parseJsonField(val) {
        if (!val) return null;
        if (typeof val === 'object') return val;
        try { return JSON.parse(val); } catch (_) { return null; }
    }

    /* ========================================
       评估器 Extra 字段处理（非 rubric 类型）
       ======================================== */
    function wrapperScorerResultExtra(extra = {}) {
        const out = {};
        Object.entries(extra).forEach(([k, v]) => {
            out[k] = parseValue(v);
        });
        return out;
    }

    function parseValue(raw) {
        // 必须是字符串
        if (typeof raw !== 'string') return raw;

        try {
            const arr = JSON.parse(raw);
            if (!Array.isArray(arr)) return raw;

            // 字段完整性校验
            const required = ['name', 'score', 'reason', 'weight', 'star', 'executed',
                'defaultScore', 'checkDescription', 'checkMethod'];
            const ok = arr.every(it => it && required.every(r => r in it));
            if (!ok) return raw;

            // 转换
            const map = {};
            arr.forEach(it => {
                const weightScore = formatNumber(it.score * it.weight);
                map[it.name] = {
                    '分数 | 权重 | 权重分数': `${formatNumber(it.score)} | ${formatNumber(it.weight)} | ${weightScore}`,
                    '默认分数': it.defaultScore,
                    '理由': it.reason,
                    '类型': it.star ? '必过检查' : '普通检查',
                    '检查方法 | 执行情况': `${it.checkMethod} | ${it.executed ? '已执行' : '未执行'}`,
                    '检查要求': it.checkDescription
                };
            });
            return map;
        } catch (_) {
            return raw;
        }
    }
</script>
