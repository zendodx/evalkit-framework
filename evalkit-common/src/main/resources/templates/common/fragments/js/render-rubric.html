<!-- Rubric 指标统计面板渲染 - 评估器级 + 维度级统计、雷达图、柱状图、可展开下钻 -->
<script th:fragment="renderRubric">
    /* Rubric 图表管理 */
    let rubricCharts = {};

    /* ========================================
       Rubric 统计主渲染入口
       ======================================== */
    function renderRubricCount() {
        setActiveButton('attrTrigger');
        showPanel('rubricCountPanel');
        // 记录当前面板到历史，支持从详情页后退回此面板
        const url = new URL(location.href);
        url.searchParams.delete('dataIndex');
        window.history.replaceState({panel: 'rubricCountPanel'}, '', url);
        const box = document.getElementById('rubricCountContent');
        const data = rubricCountResult;

        if (!data || !data.metricGroups || data.metricGroups.length === 0) {
            box.innerHTML = '<div class="rubric-no-data">暂无 Rubric 指标统计数据</div>';
            return;
        }

        // 销毁旧图表
        destroyAllRubricCharts();

        const metricGroups = data.metricGroups;

        box.innerHTML = `
            <div class="rubric-container">
                <!-- 页头 -->
                <div class="rubric-header">
                    <h3>Rubric 指标统计</h3>
                    <span class="rubric-header-stat">共 ${metricGroups.length} 个评估器</span>
                </div>

                <!-- 评估器汇总表格 -->
                <div class="rubric-summary-section">
                    <div class="rubric-section-title">评估器汇总</div>
                    <div class="rubric-table-wrapper">
                        <table class="rubric-table">
                            <thead>
                                <tr>
                                    <th>评估器</th>
                                    <th>样本数</th>
                                    <th>通过数</th>
                                    <th>失败数</th>
                                    <th>通过率</th>
                                    <th>平均分</th>
                                    <th>最低分</th>
                                    <th>最高分</th>
                                    <th>维度数</th>
                                </tr>
                            </thead>
                            <tbody id="rubricSummaryTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <!-- 评估器卡片（含维度下钻） -->
                <div class="rubric-section-title" style="margin-top:20px;">维度详情</div>
                <div class="rubric-metric-list" id="rubricMetricList"></div>
            </div>`;

        renderRubricSummaryTable(metricGroups);
        renderRubricMetricCards(metricGroups);
    }

    /* ========================================
       汇总表格渲染
       ======================================== */
    function renderRubricSummaryTable(metricGroups) {
        const tbody = document.getElementById('rubricSummaryTableBody');
        if (!tbody) return;

        tbody.innerHTML = metricGroups.map(g => {
            const passRateClass = (g.passRate || 0) >= 0.8 ? 'good' : (g.passRate || 0) >= 0.5 ? 'warning' : 'bad';
            const criteriaCount = (g.criteriaGroups || []).length;
            return `
                <tr>
                    <td><strong>${g.metricName || '-'}</strong></td>
                    <td>${g.totalCount || 0}</td>
                    <td>${g.passCount || 0}</td>
                    <td>${g.failCount || 0}</td>
                    <td class="${passRateClass}">${formatPercentage(g.passRate)}</td>
                    <td>${formatNumber(g.avgScore)}</td>
                    <td>${formatNumber(g.minScore)}</td>
                    <td>${formatNumber(g.maxScore)}</td>
                    <td>${criteriaCount}</td>
                </tr>`;
        }).join('');
    }

    /* ========================================
       评估器卡片 + 维度下钻渲染
       ======================================== */
    function renderRubricMetricCards(metricGroups) {
        const list = document.getElementById('rubricMetricList');
        if (!list) return;

        const cards = metricGroups.map((g, gIdx) => {
            const passRateClass = (g.passRate || 0) >= 0.8 ? 'good' : (g.passRate || 0) >= 0.5 ? 'warning' : 'bad';
            const criteriaGroups = g.criteriaGroups || [];
            const criteriaRows = criteriaGroups.map((c, cIdx) => renderCriteriaRow(g, c, gIdx, cIdx)).join('');

            return `
                <div class="rubric-metric-card" id="rubricCard_${gIdx}">
                    <!-- 卡片头 -->
                    <div class="rubric-card-header" onclick="toggleRubricCard(${gIdx})">
                        <div class="rubric-card-title">
                            <span class="rubric-card-name">${g.metricName || '-'}</span>
                            <span class="rubric-card-badge ${passRateClass}">${formatPercentage(g.passRate)}</span>
                            <span class="rubric-card-sub">${g.totalCount || 0} 条样本 · ${criteriaGroups.length} 个维度</span>
                        </div>
                        <div class="rubric-card-stats">
                            <span class="rubric-stat-chip">均分 ${formatNumber(g.avgScore)}</span>
                            <span class="rubric-stat-chip">通过 ${g.passCount || 0}</span>
                            <span class="rubric-stat-chip bad">失败 ${g.failCount || 0}</span>
                        </div>
                        <span class="rubric-card-toggle" id="rubricToggle_${gIdx}">▼</span>
                    </div>

                    <!-- 卡片体（可折叠） -->
                    <div class="rubric-card-body" id="rubricBody_${gIdx}">
                        ${criteriaGroups.length === 0
                            ? '<div class="rubric-no-criteria">暂无维度数据</div>'
                            : `
                            <!-- 雷达图 + 维度通过率柱状图 -->
                            <div class="rubric-charts-row">
                                <div class="rubric-chart-box">
                                    <div class="rubric-chart-title">维度归一化均分（雷达图）</div>
                                    <canvas id="rubricRadar_${gIdx}" height="220"></canvas>
                                </div>
                                <div class="rubric-chart-box">
                                    <div class="rubric-chart-title">维度通过率对比</div>
                                    <canvas id="rubricBar_${gIdx}" height="220"></canvas>
                                </div>
                            </div>

                            <!-- 维度明细表格 -->
                            <div class="rubric-criteria-section">
                                <div class="rubric-criteria-title">维度明细</div>
                                <div class="rubric-criteria-table-wrapper">
                                    <table class="rubric-criteria-table">
                                        <thead>
                                            <tr>
                                                <th>维度名称</th>
                                                <th>打分标准</th>
                                                <th>均分(原始)</th>
                                                <th>均分(归一化)</th>
                                                <th>通过阈值</th>
                                                <th>通过数</th>
                                                <th>失败数</th>
                                                <th>通过率</th>
                                                <th>操作</th>
                                            </tr>
                                        </thead>
                                        <tbody>${criteriaRows}</tbody>
                                    </table>
                                </div>
                            </div>`
                        }
                    </div>
                </div>`;
        }).join('');

        list.innerHTML = cards;

        // 渲染图表（等 DOM 就绪）
        metricGroups.forEach((g, gIdx) => {
            if ((g.criteriaGroups || []).length > 0) {
                setTimeout(() => {
                    renderRubricRadarChart(g, gIdx);
                    renderRubricBarChart(g, gIdx);
                }, 80);
            }
        });
    }

    /* ========================================
       单维度行渲染
       ======================================== */
    function renderCriteriaRow(metricGroup, criteria, gIdx, cIdx) {
        const passRateClass = (criteria.passRate || 0) >= 0.8 ? 'good' : (criteria.passRate || 0) >= 0.5 ? 'warning' : 'bad';
        const hasDataPoints = (criteria.dataPoints || []).length > 0;
        const guide = criteria.scoringGuide;
        const guideHtml = guide
            ? `<details class="rubric-scoring-guide">
                   <summary class="rubric-scoring-guide-summary">查看</summary>
                   <div class="rubric-scoring-guide-content">${escapeHtml(guide)}</div>
               </details>`
            : '<span class="rubric-no-guide">-</span>';
        return `
            <tr>
                <td><strong>${criteria.criteriaName || '-'}</strong></td>
                <td class="rubric-guide-cell">${guideHtml}</td>
                <td>${formatNumber(criteria.avgRawScore)}</td>
                <td>${formatNumber(criteria.avgNormScore)}</td>
                <td>${formatPercentage(criteria.passThreshold)}</td>
                <td>${criteria.passCount || 0}</td>
                <td>${criteria.failCount || 0}</td>
                <td class="${passRateClass}">${formatPercentage(criteria.passRate)}</td>
                <td>
                    ${hasDataPoints
                        ? `<button class="rubric-drill-btn" onclick="toggleDataPoints(${gIdx},${cIdx})">样本明细</button>`
                        : '-'}
                </td>
            </tr>
            <tr id="rubricDrillRow_${gIdx}_${cIdx}" style="display:none;">
                <td colspan="9" class="rubric-drill-cell">
                    ${renderDataPointsTable(criteria.dataPoints || [], gIdx, cIdx)}
                </td>
            </tr>`;
    }

    /* ========================================
       样本明细表格渲染（可下钻跳转 + 筛选）
       ======================================== */
    function renderDataPointsTable(dataPoints, gIdx, cIdx) {
        if (dataPoints.length === 0) return '<div class="rubric-no-data">无样本数据</div>';

        const key = `${gIdx}_${cIdx}`;
        const rows = dataPoints.map((dp, rowIdx) => {
            const passClass = dp.passed ? 'good' : 'bad';
            const passText  = dp.passed ? '✓ 通过' : '✗ 失败';
            const safeReason = typeof dp.reason === 'string' ? escapeHtml(dp.reason) : '-';
            // data-* 属性供筛选函数使用
            return `
                <tr class="rubric-drill-data-row"
                    data-raw="${dp.rawScore != null ? dp.rawScore : ''}"
                    data-norm="${dp.normScore != null ? dp.normScore : ''}"
                    data-passed="${dp.passed ? '1' : '0'}"
                    data-reason="${safeReason}">
                    <td>
                        <a class="rubric-case-link" onclick="jumpToCase(${dp.dataIndex})">#${dp.dataIndex}</a>
                    </td>
                    <td>${formatNumber(dp.rawScore)}</td>
                    <td>${formatNumber(dp.normScore)}</td>
                    <td class="${passClass}">${passText}</td>
                    <td class="rubric-reason-cell" title="${safeReason}">${safeReason || '-'}</td>
                </tr>`;
        }).join('');

        return `
            <div class="rubric-drill-filter-bar" id="rubricFilter_${key}">
                <div class="rubric-filter-row">
                    <label class="rubric-filter-label">原始分</label>
                    <input class="rubric-filter-input rubric-filter-num" type="number" step="any"
                           id="rubricFRawMin_${key}" placeholder="最小值"
                           oninput="applyDrillFilter('${key}')"/>
                    <span class="rubric-filter-sep">~</span>
                    <input class="rubric-filter-input rubric-filter-num" type="number" step="any"
                           id="rubricFRawMax_${key}" placeholder="最大值"
                           oninput="applyDrillFilter('${key}')"/>

                    <label class="rubric-filter-label" style="margin-left:10px;">归一化分</label>
                    <input class="rubric-filter-input rubric-filter-num" type="number" step="any" min="0" max="1"
                           id="rubricFNormMin_${key}" placeholder="最小值"
                           oninput="applyDrillFilter('${key}')"/>
                    <span class="rubric-filter-sep">~</span>
                    <input class="rubric-filter-input rubric-filter-num" type="number" step="any" min="0" max="1"
                           id="rubricFNormMax_${key}" placeholder="最大值"
                           oninput="applyDrillFilter('${key}')"/>

                    <label class="rubric-filter-label" style="margin-left:10px;">是否通过</label>
                    <select class="rubric-filter-select" id="rubricFPass_${key}"
                            onchange="applyDrillFilter('${key}')">
                        <option value="">全部</option>
                        <option value="1">✓ 通过</option>
                        <option value="0">✗ 失败</option>
                    </select>

                    <label class="rubric-filter-label" style="margin-left:10px;">打分理由</label>
                    <input class="rubric-filter-input rubric-filter-text" type="text"
                           id="rubricFReason_${key}" placeholder="模糊搜索…"
                           oninput="applyDrillFilter('${key}')"/>

                    <button class="rubric-filter-reset-btn" onclick="resetDrillFilter('${key}')" title="重置筛选">重置</button>
                </div>
                <div class="rubric-filter-stat" id="rubricFilterStat_${key}">共 ${dataPoints.length} 条</div>
            </div>
            <div class="rubric-drill-table-wrapper">
                <table class="rubric-drill-table" id="rubricDrillTable_${key}">
                    <thead>
                        <tr>
                            <th>用例</th>
                            <th>原始分</th>
                            <th>归一化分</th>
                            <th>是否通过</th>
                            <th>打分理由</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`;
    }

    /* ========================================
       样本明细筛选逻辑
       ======================================== */
    function applyDrillFilter(key) {
        const table  = document.getElementById(`rubricDrillTable_${key}`);
        const stat   = document.getElementById(`rubricFilterStat_${key}`);
        if (!table) return;

        const rawMin    = parseFloat(document.getElementById(`rubricFRawMin_${key}`)?.value);
        const rawMax    = parseFloat(document.getElementById(`rubricFRawMax_${key}`)?.value);
        const normMin   = parseFloat(document.getElementById(`rubricFNormMin_${key}`)?.value);
        const normMax   = parseFloat(document.getElementById(`rubricFNormMax_${key}`)?.value);
        const passVal   = document.getElementById(`rubricFPass_${key}`)?.value ?? '';
        const reasonKw  = (document.getElementById(`rubricFReason_${key}`)?.value ?? '').trim().toLowerCase();

        let visible = 0;
        table.querySelectorAll('tbody tr.rubric-drill-data-row').forEach(tr => {
            const raw    = parseFloat(tr.dataset.raw);
            const norm   = parseFloat(tr.dataset.norm);
            const passed = tr.dataset.passed;  // '1' or '0'
            const reason = (tr.dataset.reason || '').toLowerCase();

            let show = true;
            if (!isNaN(rawMin)  && raw  < rawMin)  show = false;
            if (!isNaN(rawMax)  && raw  > rawMax)  show = false;
            if (!isNaN(normMin) && norm < normMin) show = false;
            if (!isNaN(normMax) && norm > normMax) show = false;
            if (passVal !== '' && passed !== passVal) show = false;
            if (reasonKw && !reason.includes(reasonKw)) show = false;

            tr.style.display = show ? '' : 'none';
            if (show) visible++;
        });

        const total = table.querySelectorAll('tbody tr.rubric-drill-data-row').length;
        if (stat) stat.textContent = visible === total ? `共 ${total} 条` : `${visible} / ${total} 条`;
    }

    function resetDrillFilter(key) {
        const ids = [`rubricFRawMin_${key}`, `rubricFRawMax_${key}`,
                     `rubricFNormMin_${key}`, `rubricFNormMax_${key}`,
                     `rubricFReason_${key}`];
        ids.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
        const sel = document.getElementById(`rubricFPass_${key}`);
        if (sel) sel.value = '';
        applyDrillFilter(key);
    }

    /* ========================================
       卡片折叠/展开
       ======================================== */
    function toggleRubricCard(gIdx) {
        const body = document.getElementById(`rubricBody_${gIdx}`);
        const toggle = document.getElementById(`rubricToggle_${gIdx}`);
        if (!body) return;
        const isHidden = body.style.display === 'none';
        body.style.display = isHidden ? '' : 'none';
        if (toggle) toggle.textContent = isHidden ? '▼' : '▶';

        // 展开时重绘图表（防止 canvas 尺寸为 0）
        if (isHidden) {
            const g = (rubricCountResult.metricGroups || [])[gIdx];
            if (g && (g.criteriaGroups || []).length > 0) {
                setTimeout(() => {
                    renderRubricRadarChart(g, gIdx);
                    renderRubricBarChart(g, gIdx);
                }, 60);
            }
        }
    }

    /* ========================================
       样本明细展开/折叠
       ======================================== */
    function toggleDataPoints(gIdx, cIdx) {
        const row = document.getElementById(`rubricDrillRow_${gIdx}_${cIdx}`);
        if (!row) return;
        row.style.display = row.style.display === 'none' ? '' : 'none';
    }

    /* ========================================
       雷达图 - 各维度归一化均分
       ======================================== */
    function renderRubricRadarChart(metricGroup, gIdx) {
        const canvas = document.getElementById(`rubricRadar_${gIdx}`);
        if (!canvas) return;
        const criteriaGroups = metricGroup.criteriaGroups || [];
        if (criteriaGroups.length === 0) return;

        const chartKey = `radar_${gIdx}`;
        if (rubricCharts[chartKey]) {
            rubricCharts[chartKey].destroy();
            delete rubricCharts[chartKey];
        }

        const labels = criteriaGroups.map(c => c.criteriaName || '');
        const normScores = criteriaGroups.map(c => parseFloat((c.avgNormScore || 0).toFixed(3)));
        const thresholds = criteriaGroups.map(c => parseFloat((c.passThreshold || 0).toFixed(3)));

        const ctx = canvas.getContext('2d');
        rubricCharts[chartKey] = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: '均分（归一化）',
                        data: normScores,
                        backgroundColor: 'rgba(64, 158, 255, 0.2)',
                        borderColor: '#409eff',
                        borderWidth: 2,
                        pointBackgroundColor: '#409eff',
                        pointRadius: 4
                    },
                    {
                        label: '通过阈值',
                        data: thresholds,
                        backgroundColor: 'rgba(245, 108, 108, 0.1)',
                        borderColor: '#f56c6c',
                        borderWidth: 1,
                        borderDash: [4, 4],
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true,
                        position: 'bottom',
                        labels: { font: { size: 11 }, padding: 8, usePointStyle: true }
                    },
                    tooltip: {
                        callbacks: {
                            label: ctx => `${ctx.dataset.label}: ${formatNumber(ctx.parsed.r)}`
                        }
                    }
                },
                scales: {
                    r: {
                        min: 0, max: 1,
                        ticks: { stepSize: 0.2, font: { size: 10 } },
                        pointLabels: { font: { size: 11 } }
                    }
                }
            }
        });
    }

    /* ========================================
       柱状图 - 各维度通过率对比
       ======================================== */
    function renderRubricBarChart(metricGroup, gIdx) {
        const canvas = document.getElementById(`rubricBar_${gIdx}`);
        if (!canvas) return;
        const criteriaGroups = metricGroup.criteriaGroups || [];
        if (criteriaGroups.length === 0) return;

        const chartKey = `bar_${gIdx}`;
        if (rubricCharts[chartKey]) {
            rubricCharts[chartKey].destroy();
            delete rubricCharts[chartKey];
        }

        const labels = criteriaGroups.map(c => c.criteriaName || '');
        const passRates = criteriaGroups.map(c => parseFloat(((c.passRate || 0) * 100).toFixed(1)));
        const thresholdLines = criteriaGroups.map(c => parseFloat(((c.passThreshold || 0) * 100).toFixed(1)));

        const barColors = passRates.map((r, i) => r >= thresholdLines[i] ? '#67c23a' : '#f56c6c');

        const ctx = canvas.getContext('2d');
        rubricCharts[chartKey] = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: '通过率 (%)',
                        data: passRates,
                        backgroundColor: barColors,
                        borderColor: barColors,
                        borderWidth: 1,
                        borderRadius: 3
                    },
                    {
                        label: '通过阈值 (%)',
                        data: thresholdLines,
                        type: 'line',
                        borderColor: '#e6a23c',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        pointRadius: 0,
                        fill: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true,
                        position: 'bottom',
                        labels: { font: { size: 11 }, padding: 8, usePointStyle: true }
                    },
                    tooltip: {
                        callbacks: {
                            label: ctx => `${ctx.dataset.label}: ${formatNumber(ctx.parsed.y)}%`
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: { font: { size: 11 } },
                        grid: { display: false }
                    },
                    y: {
                        beginAtZero: true,
                        max: 100,
                        ticks: {
                            font: { size: 11 },
                            callback: v => v + '%'
                        },
                        grid: { color: 'rgba(0,0,0,0.05)' }
                    }
                }
            }
        });
    }

    /* ========================================
       销毁所有 Rubric 图表
       ======================================== */
    function destroyAllRubricCharts() {
        Object.values(rubricCharts).forEach(chart => {
            if (chart && typeof chart.destroy === 'function') chart.destroy();
        });
        rubricCharts = {};
    }
</script>
